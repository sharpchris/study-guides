<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renaissance &amp; Reformation: Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECEEF2;
    --surface: #FFFFFF;
    --ink: #1E2433;
    --muted: #586074;
    --line: #CDD2DC;
    --lapis: #2B4C9B;
    --lapis-soft: #DFE6F5;
    --ochre: #D9A441;
    --good: #2E7D4F;
    --good-soft: #DDEFE3;
    --bad: #B02A4A;
    --bad-soft: #F7DFE5;
    --display: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    --body: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161F; --surface: #1B2130; --ink: #E6E9F0; --muted: #A2AABB; --line: #323B4F;
      --lapis: #8FA9E8; --lapis-soft: #22305A; --ochre: #E2B457;
      --good: #62C48E; --good-soft: #1B3F2E; --bad: #F27C97; --bad-soft: #43202A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161F; --surface: #1B2130; --ink: #E6E9F0; --muted: #A2AABB; --line: #323B4F;
    --lapis: #8FA9E8; --lapis-soft: #22305A; --ochre: #E2B457;
    --good: #62C48E; --good-soft: #1B3F2E; --bad: #F27C97; --bad-soft: #43202A;
  }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 5rem); }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.6 var(--body); }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 4rem; }

  /* Hero */
  .hero { padding: 3.25rem 0 2rem; display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: end; }
  .hero h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.6rem, 8vw, 4.2rem); line-height: 0.95; letter-spacing: -0.01em;
    margin: 0 0 1rem;
  }
  .hero h1 small { display: block; font-family: var(--body); font-weight: 700; font-size: 0.95rem; letter-spacing: 0; color: var(--muted); margin-bottom: 0.6rem; }
  .hero p { margin: 0; color: var(--muted); max-width: 32rem; }
  .dome { width: 8.5rem; height: auto; color: var(--lapis); }
  @media (max-width: 34rem) {
    .hero { grid-template-columns: 1fr; padding-top: 2.25rem; }
    .dome { width: 5.5rem; order: -1; }
  }

  section { padding: 2rem 0 1.5rem; border-top: 1px solid var(--line); }

  .btn {
    font: 700 1rem var(--body); padding: 0.7rem 1.3rem; border-radius: 999px;
    border: 2px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn:hover { filter: brightness(1.12); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  :focus-visible { outline: 3px solid var(--ochre); outline-offset: 3px; }

  .mode { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0 0 1rem; font-size: 0.95rem; }
  .mode span { color: var(--muted); font-weight: 700; margin-right: 0.25rem; }
  .mode button { font: 700 0.9rem var(--body); padding: 0.4rem 0.9rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .mode button[aria-pressed="true"] { border-color: var(--lapis); background: var(--lapis-soft); }

  /* Quiz */
  .progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 0.75rem 0; margin-bottom: 0.5rem; }
  .progress-text { font-size: 0.9rem; font-weight: 700; color: var(--muted); }
  .bar { height: 0.45rem; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 0.35rem; }
  .bar span { display: block; height: 100%; width: 0; background: var(--lapis); transition: width 0.25s; }

  fieldset.q { border: 1.5px solid var(--line); background: var(--surface); border-radius: 0.9rem; padding: 1.1rem 1.2rem 1.2rem; margin: 0 0 1rem; min-width: 0; }
  fieldset.q legend { float: left; width: 100%; padding: 0; margin: 0 0 0.8rem; }
  .qnum { display: block; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  .prompt { display: block; font-size: 1.1rem; line-height: 1.5; }
  .opts { clear: both; display: grid; gap: 0.5rem; }
  .opt { display: flex; gap: 0.7rem; align-items: center; padding: 0.65rem 0.85rem; border: 1.5px solid var(--line); border-radius: 0.6rem; cursor: pointer; }
  .opt:hover { border-color: var(--lapis); }
  .opt input { accent-color: var(--lapis); width: 1.15rem; height: 1.15rem; margin: 0; flex: none; }
  .opt:has(input:checked) { border-color: var(--lapis); background: var(--lapis-soft); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--ochre); outline-offset: 2px; }
  .opt .tag { margin-left: auto; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }

  fieldset.q.missing { border-color: var(--ochre); }
  fieldset.q.graded .opt { cursor: default; }
  fieldset.q.graded .opt:hover { border-color: var(--line); }
  fieldset.q.graded .opt:has(input:checked) { background: transparent; border-color: var(--line); }
  fieldset.q.is-right { border-color: var(--good); border-left-width: 6px; }
  fieldset.q.is-wrong { border-color: var(--bad); border-left-width: 6px; }
  fieldset.q.graded .opt.is-answer { border-color: var(--good); background: var(--good-soft); }
  fieldset.q.graded .opt.is-answer .tag { color: var(--good); }
  fieldset.q.graded .opt.is-wrong-pick { border-color: var(--bad); background: var(--bad-soft); }
  fieldset.q.graded .opt.is-wrong-pick .tag { color: var(--bad); }

  .feedback { margin-top: 0.9rem; padding: 0.8rem 1rem; border-radius: 0.6rem; font-size: 0.97rem; line-height: 1.5; }
  .feedback strong { display: block; margin-bottom: 0.15rem; }
  .feedback.good { background: var(--good-soft); }
  .feedback.good strong { color: var(--good); }
  .feedback.bad { background: var(--bad-soft); }
  .feedback.bad strong { color: var(--bad); }

  .submit-area { margin: 1.5rem 0 1rem; }
  .note { margin-top: 0.9rem; padding: 0.9rem 1rem; border: 1.5px solid var(--ochre); border-radius: 0.6rem; background: var(--surface); }
  .note p { margin: 0 0 0.75rem; }

  .results { background: var(--surface); border: 2px solid var(--lapis); border-radius: 1rem; padding: 1.4rem 1.5rem; margin: 0.5rem 0 1.5rem; }
  .score-line { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  .score-big { font-family: var(--display); font-weight: 700; font-size: 3.4rem; line-height: 1; }
  .score-pct { font-weight: 700; color: var(--muted); }
  .results p { margin: 0.75rem 0; }
  .missed { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; padding: 0; list-style: none; }
  .missed button { font: 700 0.9rem var(--body); color: var(--bad); background: var(--bad-soft); border: 0; border-radius: 999px; padding: 0.35rem 0.8rem; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <h1><small>World History practice quiz</small>Renaissance &amp; Reformation</h1>
      <p>One multiple-choice question for every question on the study guide. Answer them all, press Submit, then read the explanations and retake the ones you missed.</p>
    </div>
    <svg class="dome" viewBox="0 0 120 120" aria-hidden="true" fill="currentColor">
      <rect x="56" y="6" width="8" height="10" rx="1"/>
      <rect x="52" y="16" width="16" height="12" rx="1.5"/>
      <path d="M18 86 C18 52 36 30 60 28 C84 30 102 52 102 86 Z"/>
      <rect x="12" y="86" width="96" height="8" rx="1.5"/>
      <rect x="16" y="96" width="88" height="18" rx="1.5" opacity="0.55"/>
      <g stroke="var(--bg)" stroke-width="2.2" fill="none">
        <path d="M60 30 L60 86"/>
        <path d="M45 36 C38 52 36 70 36 86"/>
        <path d="M75 36 C82 52 84 70 84 86"/>
      </g>
    </svg>
  </header>

  <section id="quiz" aria-label="Practice quiz">
    <div class="mode" role="group" aria-label="Question order">
      <span>Question order:</span>
      <button type="button" id="mode-guide" aria-pressed="true">Study guide order</button>
      <button type="button" id="mode-shuffle" aria-pressed="false">Shuffled</button>
    </div>

    <div class="results" id="results" hidden tabindex="-1" aria-live="polite"></div>

    <div class="progress">
      <div class="progress-text" id="progress-text"></div>
      <div class="bar"><span id="progress-bar"></span></div>
    </div>

    <form onsubmit="return false;">
      <div id="questions"></div>
      <div class="submit-area">
        <button class="btn" id="submit-quiz" type="button">Submit quiz</button>
        <div class="note" id="submit-note" hidden role="alert"></div>
      </div>
    </form>
  </section>

</div>

<script>
/* One entry per study-guide question, in study-guide order.
   The first option in each list is the correct answer; options are shuffled when shown. */
const QUESTIONS = [
  { term: "Meaning of Renaissance",
    prompt: "What does the word Renaissance mean?",
    options: ["Rebirth", "Reform", "Revolution", "Golden age"],
    why: "Renaissance means “rebirth.” People saw it as a rebirth of ancient Greek and Roman learning after the Middle Ages." },
  { term: "Dates of the Renaissance",
    prompt: "Between what years did the Renaissance take place in Western Europe?",
    options: ["From the 1300s to the 1500s", "From the 1000s to the 1200s", "From the 1500s to the 1700s", "From the 1700s to the 1800s"],
    why: "The Renaissance began in Italy in the mid-1300s, spread north, and peaked in the 1500s." },
  { term: "Florence",
    prompt: "Which city was the most important center where the Renaissance began in Italy?",
    options: ["Florence", "Venice", "Naples", "Genoa"],
    why: "Florence was the heart of the Italian Renaissance. Trade with the Muslim world helped bring ancient learning to Italy, but Florence is the city where it all centered." },
  { term: "The Medici",
    prompt: "What family used their banking wealth to make Florence Italy’s most artistic city?",
    options: ["The Medici family", "The Borgia family", "The Sforza family", "The Habsburg family"],
    why: "The Medici were bankers who became Florence’s rulers and some of the biggest patrons of Renaissance art." },
  { term: "Start of the 100 Years’ War",
    prompt: "The Hundred Years’ War began in 1337 when which country invaded France?",
    options: ["England", "Spain", "Italy", "The Holy Roman Empire"],
    why: "England invaded France in 1337, starting a long series of wars over who should rule France." },
  { term: "Joan of Arc",
    prompt: "Who had a vision in 1429 that she could lead France to victory in the Hundred Years’ War?",
    options: ["Joan of Arc", "Queen Isabella", "Eleanor of Aquitaine", "Catherine de’ Medici"],
    why: "Joan of Arc, a teenage peasant girl, believed God told her to help France. She led French troops to important victories." },
  { term: "Longbows and gunpowder",
    prompt: "What two weapons made feudal lords less powerful during the Hundred Years’ War?",
    options: ["Longbows and gunpowder", "Swords and lances", "Catapults and battering rams", "Crossbows and chain mail"],
    why: "Longbow arrows could pierce armor, and cannons using gunpowder could knock down castle walls. Knights and castles mattered less, so feudal lords lost power." },
  { term: "The Western Schism",
    prompt: "What split in the Catholic Church, caused by disagreements between Italian and French Catholics, led to two rival popes?",
    options: ["The Western Schism (Great Schism)", "The Protestant Reformation", "The Diet of Worms", "The Hundred Years’ War"],
    why: "During the Western Schism (1378–1417), Italian and French Catholics each backed their own pope. Watch out: your study guide lists the year 1054, but 1054 is a different split, between the Roman Catholic and Eastern Orthodox churches." },
  { term: "What humanists studied",
    prompt: "What did humanists study during the Renaissance?",
    options: ["Greek and Roman cultures", "Egyptian and Persian cultures", "Only the Bible and Church teachings", "Chinese and Indian cultures"],
    why: "Humanists studied classical Greek and Roman cultures to better understand their own times." },
  { term: "The ideal man",
    prompt: "What were the qualities of the ideal man during the Renaissance?",
    options: ["Talents and skills in many fields", "Great wealth and noble birth", "Loyalty to a feudal lord", "Strict religious devotion and a quiet life"],
    why: "The Renaissance ideal was a person skilled in many different fields, like Leonardo da Vinci. That’s where the phrase “Renaissance man” comes from." },
  { term: "Renaissance art techniques",
    prompt: "Which three artistic styles or techniques were used during the Renaissance?",
    options: [
      "Perspective, shading with light and dark to make objects look real, and the study of human anatomy",
      "Pointed Gothic arches, stained glass, and illuminated manuscripts",
      "Flat gold backgrounds, mosaics, and religious icons",
      "Abstract shapes, bold flat colors, and loose, visible brushstrokes"
    ],
    why: "Perspective shows depth, shading makes figures look round, and studying anatomy makes bodies accurate. Gothic and gold-background styles are medieval; abstract art is modern." },
  { term: "Giotto",
    prompt: "Who was considered the first Renaissance artist, creating lifelike frescoes on wet plaster walls?",
    options: ["Giotto di Bondone", "Raphael", "Jan van Eyck", "Donatello"],
    why: "Giotto painted lifelike frescoes (paintings on wet plaster) in the early 1300s, before the Renaissance was in full swing." },
  { term: "Paul Cézanne",
    prompt: "Who became known as the Father of Modern Painting by adding perspective to art?",
    options: ["Paul Cézanne", "Raphael", "Jan van Eyck", "Donatello"],
    why: "Your study guide names Paul Cézanne as the Father of Modern Painting. Don’t mix him up with Giotto, who was the first Renaissance artist." },
  { term: "Michelangelo’s David",
    prompt: "Who was the first great sculptor of the Renaissance who sculpted the first large free-standing David?",
    options: ["Michelangelo", "Raphael", "Leonardo da Vinci", "Giotto di Bondone"],
    why: "Michelangelo sculpted the huge marble David, which echoes ancient Greek sculpture. He also painted the Sistine Chapel ceiling." },
  { term: "Sistine Chapel ceiling",
    prompt: "Whose greatest work is the ceiling of the Sistine Chapel?",
    options: ["Michelangelo", "Raphael", "Leonardo da Vinci", "Giotto di Bondone"],
    why: "Starting in 1508, Michelangelo spent about four years painting Bible scenes on the Sistine Chapel ceiling in Rome." },
  { term: "Raphael",
    prompt: "Which artist painted School of Athens and became the favorite painter of the Pope?",
    options: ["Raphael", "Michelangelo", "Leonardo da Vinci", "Masaccio"],
    why: "Raphael painted School of Athens for the Pope’s rooms in the Vatican. It shows great Greek thinkers alongside Renaissance artists." },
  { term: "Leonardo da Vinci",
    prompt: "Who painted The Last Supper and the Mona Lisa?",
    options: ["Leonardo da Vinci", "Michelangelo", "Raphael", "Giotto di Bondone"],
    why: "Leonardo da Vinci painted both. He was also an inventor, scientist, and engineer, the model “Renaissance man.”" },
  { term: "Flanders",
    prompt: "In which region were painters the first to use oils and criticize the Catholic Church?",
    options: ["Flanders", "Florence", "Spain", "England"],
    why: "Flanders (in today’s Belgium) was the center of the Northern Renaissance. Flemish painters pioneered oil paint." },
  { term: "Thomas More",
    prompt: "Who wrote Utopia to criticize society in England?",
    options: ["Sir Thomas More", "William Shakespeare", "Niccolò Machiavelli", "Martin Luther"],
    why: "In Utopia, Sir Thomas More described an imaginary perfect society to point out what was wrong with England." },
  { term: "Shakespeare",
    prompt: "Who wrote plays in England based on the classics and universal human qualities?",
    options: ["William Shakespeare", "Sir Thomas More", "Francesco Petrarch", "Baldassare Castiglione"],
    why: "Shakespeare often borrowed stories from the classics, and his plays explore feelings everyone shares, like love, jealousy, and ambition." },
  { term: "Jan van Eyck",
    prompt: "Which Dutch artist was noted for precise realism and symbolism in the Wedding Portrait?",
    options: ["Jan van Eyck", "Pieter Bruegel", "Albrecht Dürer", "Rembrandt"],
    why: "Jan van Eyck’s Wedding Portrait (the Arnolfini Portrait) is famous for tiny realistic details and hidden symbols." },
  { term: "Catholic salvation",
    prompt: "According to the Catholic Church, how is salvation reached?",
    options: ["Through faith and good works", "Through faith alone", "Through reading the Bible alone", "Through wealth and power"],
    why: "The Catholic Church taught that salvation comes through faith and good works. Martin Luther disagreed and taught salvation by faith alone." },
  { term: "Seven sacraments",
    prompt: "How many holy sacraments form the basis of beliefs in the Catholic Church?",
    options: ["Seven", "Three", "Ten", "Twelve"],
    why: "Priests perform seven sacraments: baptism, confirmation, marriage, ordination, communion, anointing of the sick, and penance." },
  { term: "95 Theses",
    prompt: "What did Martin Luther write to criticize Church corruption and the selling of indulgences?",
    options: ["The 95 Theses", "Utopia", "The Prince", "The Book of the Courtier"],
    why: "In 1517 Luther wrote the 95 Theses, a list of 95 arguments against Church abuses like selling indulgences." },
  { term: "Diet of Worms",
    prompt: "At what event in 1521 was Martin Luther excommunicated from the Catholic Church?",
    options: ["The Diet of Worms", "The Council of Trent", "The Peace of Augsburg", "The Western Schism"],
    why: "At the Diet of Worms (an assembly in the German city of Worms), Luther refused to take back his writings and was declared an outlaw." },
  { term: "Lutheranism",
    prompt: "What first Protestant faith was founded by Martin Luther, emphasizing salvation by faith alone?",
    options: ["Lutheranism", "Calvinism", "Anglicanism", "Methodism"],
    why: "Lutheranism was the first Protestant church. Its followers are called Lutherans." },
  { term: "Scientific Revolution",
    prompt: "What movement in the 1600s led to a breakthrough in European thought where everything was questioned?",
    options: ["The Scientific Revolution", "The Reformation", "The Renaissance", "The Industrial Revolution"],
    why: "During the Scientific Revolution, thinkers stopped simply accepting old authorities and tested ideas through observation and experiment." },
  { term: "Deductive reasoning",
    prompt: "What type of reasoning starts from something general and uses logic to prove a hypothesis?",
    options: ["Deductive reasoning", "Inductive reasoning", "Circular reasoning", "Emotional reasoning"],
    why: "Deductive reasoning goes from general to specific. Memory trick: deDuctive goes Down from the big idea." },
  { term: "Inductive reasoning",
    prompt: "What type of reasoning observes something specific and uses logic to make a general statement?",
    options: ["Inductive reasoning", "Deductive reasoning", "Circular reasoning", "Emotional reasoning"],
    why: "Inductive reasoning goes from specific observations up to a general statement. It’s the reverse of deductive reasoning." },
  { term: "William Harvey",
    prompt: "Who was the English doctor who proved that blood circulates through the body and is pumped by the heart?",
    options: ["William Harvey", "Andreas Vesalius", "Isaac Newton", "Francis Bacon"],
    why: "William Harvey showed that the heart pumps blood around the body in a circuit." },
  { term: "Andreas Vesalius",
    prompt: "Who brought innovation to the study of human anatomy by observing nature rather than reading books?",
    options: ["Andreas Vesalius", "William Harvey", "Galileo Galilei", "René Descartes"],
    why: "Vesalius dissected human bodies and recorded what he actually saw, correcting mistakes in ancient medical books." },
  { term: "Nicolaus Copernicus",
    prompt: "Who introduced the heliocentric hypothesis stating that Earth and other bodies revolve around the sun?",
    options: ["Nicolaus Copernicus", "Isaac Newton", "Ptolemy", "Johannes Kepler"],
    why: "Copernicus proposed the heliocentric (sun-centered) model. Ptolemy’s older model put Earth at the center." },
  { term: "Isaac Newton",
    prompt: "Who discovered the theory of gravity and created calculus?",
    options: ["Isaac Newton", "Galileo Galilei", "René Descartes", "Nicolaus Copernicus"],
    why: "Isaac Newton explained gravity with his law of universal gravitation and developed calculus." },
  { term: "Johannes Kepler",
    prompt: "Which astronomer mathematically proved Copernicus’ theory and showed that planets move in ellipses?",
    options: ["Johannes Kepler", "Tycho Brahe", "Galileo Galilei", "Ptolemy"],
    why: "Kepler used math to show that planets orbit the sun in ellipses (ovals). Your study guide says Tycho Brahe, who was Kepler’s teacher and collected the observations Kepler used, but Kepler did the proof. Check this one with your teacher." },
  { term: "René Descartes",
    prompt: "Which philosopher and mathematician stated, “I think, therefore I am”?",
    options: ["René Descartes", "Isaac Newton", "Francis Bacon", "Thomas More"],
    why: "René Descartes said this to show that the one thing he could not doubt was that he himself existed, because he was thinking." }
];

const $ = (s) => document.querySelector(s);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

const ALL = QUESTIONS.map((_, i) => i);
const state = { ids: [], order: [], opts: {}, picks: {}, submitted: false, isFull: true, lastCorrect: 0, shuffled: false };

function startQuiz(ids, isFull) {
  state.ids = ids;
  state.order = state.shuffled ? shuffle(ids) : ids.slice().sort((a, b) => a - b);
  state.opts = {};
  ids.forEach((i) => { state.opts[i] = shuffle(QUESTIONS[i].options); });
  state.picks = {};
  state.submitted = false;
  state.isFull = isFull;
  $("#results").hidden = true;
  $("#submit-note").hidden = true;
  $("#submit-quiz").hidden = false;
  renderQuiz();
  updateProgress();
}

function setMode(shuffled) {
  state.shuffled = shuffled;
  $("#mode-guide").setAttribute("aria-pressed", String(!shuffled));
  $("#mode-shuffle").setAttribute("aria-pressed", String(shuffled));
  const answered = Object.keys(state.picks).length;
  if (!state.submitted && answered > 0) {
    // Keep answers: just reorder the questions on the page.
    state.order = shuffled ? shuffle(state.ids) : state.ids.slice().sort((a, b) => a - b);
    const box = $("#questions");
    state.order.forEach((qi, n) => {
      const fs = document.getElementById("q-" + qi);
      fs.querySelector(".qnum").textContent = qlabel(qi, n);
      box.append(fs);
    });
  } else {
    startQuiz(state.ids, state.isFull);
  }
}
$("#mode-guide").addEventListener("click", () => setMode(false));
$("#mode-shuffle").addEventListener("click", () => setMode(true));

function qlabel(qi, n) {
  return "Question " + (n + 1) + " of " + state.order.length + " · Study guide #" + (qi + 1);
}

function renderQuiz() {
  const box = $("#questions");
  box.innerHTML = "";
  state.order.forEach((qi, n) => {
    const q = QUESTIONS[qi];
    const fs = el("fieldset", "q");
    fs.id = "q-" + qi;
    const lg = el("legend");
    lg.append(el("span", "qnum", qlabel(qi, n)), el("span", "prompt", q.prompt));
    fs.append(lg);
    const opts = el("div", "opts");
    state.opts[qi].forEach((opt) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio";
      inp.name = "q" + qi;
      inp.value = opt;
      inp.addEventListener("change", () => {
        state.picks[qi] = opt;
        fs.classList.remove("missing");
        updateProgress();
      });
      lab.append(inp, el("span", null, opt));
      opts.append(lab);
    });
    fs.append(opts);
    const fb = el("div", "feedback");
    fb.hidden = true;
    fs.append(fb);
    box.append(fs);
  });
}

function updateProgress() {
  const total = state.order.length;
  const done = state.order.filter((i) => state.picks[i] != null).length;
  $("#progress-text").textContent = state.submitted
    ? "Submitted: " + state.lastCorrect + " of " + total + " correct"
    : done + " of " + total + " answered";
  $("#progress-bar").style.width = (total ? (done / total) * 100 : 0) + "%";
}

$("#submit-quiz").addEventListener("click", () => {
  const unanswered = state.order.filter((i) => state.picks[i] == null);
  if (unanswered.length === 0) { grade(); return; }
  unanswered.forEach((i) => $("#q-" + i).classList.add("missing"));
  const note = $("#submit-note");
  note.innerHTML = "";
  const count = unanswered.length;
  note.append(el("p", null,
    count + (count === 1 ? " question is" : " questions are") +
    " still unanswered (outlined in gold). Unanswered questions count as wrong."));
  const row = el("div", "btn-row");
  const go = el("button", "btn secondary", "Go to first unanswered");
  go.type = "button";
  go.addEventListener("click", () => {
    const first = document.getElementById("q-" + unanswered[0]);
    first.scrollIntoView({ behavior: "smooth", block: "start" });
    first.querySelector("input").focus({ preventScroll: true });
  });
  const anyway = el("button", "btn", "Submit anyway");
  anyway.type = "button";
  anyway.addEventListener("click", grade);
  row.append(go, anyway);
  note.append(row);
  note.hidden = false;
});

function grade() {
  state.submitted = true;
  $("#submit-note").hidden = true;
  $("#submit-quiz").hidden = true;
  let correct = 0;
  const missed = [];
  state.order.forEach((qi) => {
    const q = QUESTIONS[qi];
    const answer = q.options[0];
    const pick = state.picks[qi];
    const right = pick === answer;
    if (right) correct++; else missed.push(qi);
    const fs = $("#q-" + qi);
    fs.classList.remove("missing");
    fs.classList.add("graded", right ? "is-right" : "is-wrong");
    fs.querySelectorAll("label.opt").forEach((lab) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (inp.value === answer) {
        lab.classList.add("is-answer");
        lab.append(el("span", "tag", right ? "✓ Your answer" : "✓ Correct answer"));
      } else if (inp.value === pick) {
        lab.classList.add("is-wrong-pick");
        lab.append(el("span", "tag", "✗ Your answer"));
      }
    });
    const fb = fs.querySelector(".feedback");
    fb.className = "feedback " + (right ? "good" : "bad");
    let head;
    if (right) head = "Correct!";
    else if (pick == null) head = "No answer. The answer is " + answer + ".";
    else head = "Not quite. You picked " + pick + ", but the answer is " + answer + ".";
    fb.append(el("strong", null, head), el("span", null, q.why));
    fb.hidden = false;
  });
  state.lastCorrect = correct;
  showResults(correct, state.order.length, missed);
  updateProgress();
}

function showResults(correct, total, missed) {
  const pct = Math.round((correct / total) * 100);
  const box = $("#results");
  box.innerHTML = "";
  const line = el("div", "score-line");
  line.append(el("span", "score-big", correct + "/" + total), el("span", "score-pct", pct + "% correct"));
  box.append(line);

  let msg;
  if (!state.isFull && pct === 100) msg = "You got every missed question right this time. Nice recovery.";
  else if (pct === 100) msg = "Every one right. You’re ready for this test.";
  else if (pct >= 80) msg = "Solid work. Read the explanations for the ones you missed, then retake just those.";
  else if (pct >= 60) msg = "Getting there. Read the explanations below, then retake the ones you missed.";
  else msg = "Worth another pass. Read the explanations below, go over your study guide, and try again.";
  box.append(el("p", null, msg));

  if (missed.length) {
    box.append(el("p", null, "Topics to review (tap one to jump to it):"));
    const ul = el("ul", "missed");
    missed.forEach((qi) => {
      const li = el("li");
      const b = el("button", null, QUESTIONS[qi].term);
      b.type = "button";
      b.addEventListener("click", () => document.getElementById("q-" + qi).scrollIntoView({ behavior: "smooth", block: "start" }));
      li.append(b);
      ul.append(li);
    });
    box.append(ul);
  }

  const row = el("div", "btn-row");
  if (missed.length) {
    const rm = el("button", "btn", "Retake the " + missed.length + " I missed");
    rm.type = "button";
    rm.addEventListener("click", () => { startQuiz(missed, false); $("#quiz").scrollIntoView({ behavior: "smooth" }); });
    row.append(rm);
  }
  const ra = el("button", missed.length ? "btn secondary" : "btn", "Retake the whole quiz");
  ra.type = "button";
  ra.addEventListener("click", () => { startQuiz(ALL, true); $("#quiz").scrollIntoView({ behavior: "smooth" }); });
  row.append(ra);
  box.append(row);

  box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  box.focus({ preventScroll: true });
}

startQuiz(ALL, true);
</script>
</body>
</html>
